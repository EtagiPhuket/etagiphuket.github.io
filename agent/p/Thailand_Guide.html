<script>
var AG=(function(){var K=["n","wa","tg","mx","ph"],a={},q;try{q=new URLSearchParams(location.search)}catch(e){q={get:function(){return null}}}
K.forEach(function(x){var v=q.get(x);if(v)a[x]=v.trim()});
if(Object.keys(a).length){try{localStorage.setItem("etagi_ag",JSON.stringify(a))}catch(e){}}else{try{a=JSON.parse(localStorage.getItem("etagi_ag")||"{}")||{}}catch(e){a={}}}
var qs=K.filter(function(x){return a[x]}).map(function(x){return x+"="+encodeURIComponent(a[x])}).join("&");qs=qs?"?"+qs:"";
function dig(s){return (s||"").replace(/\D/g,"")}
function tg(){return (a.tg||"").replace(/^@/,"").replace(/^https?:\/\/t\.me\//,"")}
function link(t){if(a.wa)return "https://wa.me/"+dig(a.wa)+"?text="+encodeURIComponent(t);if(a.tg)return "https://t.me/"+tg();if(a.mx)return a.mx;if(a.ph)return "sms:+"+dig(a.ph)+"?&body="+encodeURIComponent(t);return ""}
function chan(){return a.wa?"WhatsApp":a.tg?"Telegram":a.mx?"MAX":a.ph?"SMS":""}
function toast(m){var n=document.getElementById("agtoast");if(!n){n=document.createElement("div");n.id="agtoast";n.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16171A;color:#fff;padding:12px 16px;border-radius:12px;font:14px/1.35 system-ui,sans-serif;z-index:99;max-width:88vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)";document.body.appendChild(n)}n.textContent=m;n.hidden=false;clearTimeout(n._t);n._t=setTimeout(function(){n.hidden=true},5000)}
function copy(t){try{navigator.clipboard&&navigator.clipboard.writeText(t).catch(function(){})}catch(e){}}
return {a:a,qs:qs,link:link,chan:chan,toast:toast,copy:copy,has:function(){return !!chan()}}})();
document.addEventListener("click",function(e){var l=e.target.closest&&e.target.closest("a[href]");if(l&&AG.qs){var h=l.getAttribute("href");if(/\.html$|\/$|^\.\.?\/?$/.test(h)&&!/^(https?:|mailto:|tel:|#)/.test(h))l.setAttribute("href",h+AG.qs)}
var el=e.target.closest&&e.target.closest("a.agc,a.wa");if(!el)return;
var t=el.getAttribute("data-t")||(typeof waText=="function"?waText():"");var c=AG.chan();
if(!c){e.preventDefault();AG.copy(t);AG.toast("Текст скопирован — отправьте его специалисту «Этажей», который прислал вам эту ссылку");return}
if(c=="Telegram"||c=="MAX"){AG.copy(t);AG.toast("Текст скопирован — вставьте его в чат и отправьте")}});
document.addEventListener("DOMContentLoaded",function(){var a=AG.a,c=AG.chan(),nm=a.n||"Специалист «Этажей»";
document.querySelectorAll('a[href$=".html"],a[href$="/"],a[href="../"],a[href="./"]').forEach(function(x){var h=x.getAttribute("href");if(!/^(https?:|mailto:|tel:|#)/.test(h)&&AG.qs)x.setAttribute("href",h+AG.qs)});
document.querySelectorAll(".agn").forEach(function(x){x.textContent=nm});
document.querySelectorAll(".agi").forEach(function(x){x.textContent=(nm.replace(/[«»"]/g,"").trim()[0]||"Э").toUpperCase()});
document.querySelectorAll("a.agc").forEach(function(x){if(!c){x.hidden=true;return}x.href=AG.link(x.getAttribute("data-t")||"");x.target="_blank";x.rel="noopener";x.textContent=(x.getAttribute("data-l")||"Написать в WhatsApp").replace("WhatsApp",c)});
document.querySelectorAll("a.agp").forEach(function(x){if(!a.ph){x.hidden=true;return}x.href="tel:+"+a.ph.replace(/\D/g,"");var d=a.ph.replace(/\D/g,"");x.textContent="Позвонить · "+(d.length==11&&d[0]=="7"?"+7 "+d.slice(1,4)+" "+d.slice(4,7)+"-"+d.slice(7,9)+"-"+d.slice(9):a.ph)});
document.querySelectorAll(".agnone").forEach(function(x){x.hidden=c||a.ph?true:false});});
